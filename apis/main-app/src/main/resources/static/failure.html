<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Catálogo Edificações - Falha</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .container { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid #dc3545; }
        .error-box { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 4px; margin-top: 15px; font-weight: bold; }
        .btn { display: inline-block; padding: 10px 15px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Falha na Autenticação</h2>
        <p>O ecossistema de segurança barrou esta tentativa de acesso.</p>
        <div class="error-box">
            Acesso negado. Certifique-se de utilizar uma conta institucional ativa (@ifce.edu.br) ou que esteja devidamente pré-cadastrada.
        </div>
        <a href="/oauth2/authorization/google" class="btn">Tentar Novamente</a>
    </div>
</body>
</html>
