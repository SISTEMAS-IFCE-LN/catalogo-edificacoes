spring:
  application:
    name: catalogo-edificacoes
  profiles:
    active:
      - ${PROFILE_ACTIVE:dev}
  jpa:
    open-in-view: false
  sql:
    init:
      mode: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict
        max-age: 43200

jwt:
  refresh-expiration: 43200000

rsa:
  public-key: ${JWT_PUBLIC_KEY}
  private-key: ${JWT_PRIVATE_KEY}

app:
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
