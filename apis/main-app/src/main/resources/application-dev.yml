spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2

server:
  servlet:
    session:
      cookie:
        secure: false

app:
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:dev-admin@ifce.edu.br}
