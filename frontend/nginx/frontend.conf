# =============================================================================
# Servidor do SPA — modo integrado (frontend + api na mesma rede Docker).
# HTTP puro: em produção o TLS é terminado no reverse proxy/ALB upstream
# (ver docs/arquitetura-frontend.md §14).
# =============================================================================
server {
    listen 8000;
    server_name _;

    client_max_body_size 1m;

    root /var/www/catalogo-frontend/dist;
    index index.html;

    # Cache de assets com hash (Vite emite /assets/[name].[hash].js)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — qualquer rota do app cai em index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Proxy /auth/** (refresh/CSRF/logout — cookies na mesma origem)
    location /auth/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
    }

    # Proxy do handshake OAuth2: /oauth2/** e /login/oauth2/** (callback do
    # Google). NÃO capturar `/login` puro — é rota do SPA (src/router/index.tsx);
    # a regex espelha o proxy de dev do vite.config.ts.
    location ~ ^/(oauth2|login/oauth2)(/.*)?$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Proxy /api/** (Authorization via header; sem CSRF)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Health check do container
    location = /health-frontend {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
