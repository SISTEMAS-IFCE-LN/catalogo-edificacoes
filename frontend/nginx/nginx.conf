# =============================================================================
# nginx.conf base da imagem do frontend.
# Roda como usuário não-root (`nginx`): pid e logs são redirecionados para
# /tmp e stdout/stderr, sem exigir privilégios administrativos.
# =============================================================================
worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    # Preserva X-Forwarded-Proto do proxy upstream (TLS em produção) com
    # fallback para o scheme da conexão direta (dev). Sem isso o backend
    # reconstruiria redirect_uri/cookies com http atrás de TLS.
    map $http_x_forwarded_proto $forwarded_proto {
        ''      $scheme;
        default $http_x_forwarded_proto;
    }

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    include /etc/nginx/conf.d/*.conf;
}
